# Oracle Database connection settings.
# Replace host, port, service name, username and password with environment-specific values.
db.url=jdbc:oracle:thin:@//localhost:1521/ORCLPDB1
db.username=app_user
db.password=change_me

# Oracle Universal Connection Pool settings.
# initial-size: physical connections created when the pool starts.
# min-size: minimum connections retained by UCP.
# max-size: hard upper limit for simultaneous physical database connections.
db.pool.name=sql-query-scheduler-pool
db.pool.initial-size=2
db.pool.min-size=2
db.pool.max-size=6

# Maximum wait for a free pooled connection when all connections are busy.
db.pool.connection-wait-timeout-seconds=30

# Reclaims borrowed connections that remain inactive for this duration; 0 disables it.
db.pool.inactive-connection-timeout-seconds=0

# Validates a pooled connection before it is handed to the application.
db.pool.validate-connection-on-borrow=true

# SQL executed by the scheduled job.
query.sql=SELECT ID, EVENT_NAME, CREATED_AT FROM SCHEDULED_EVENT ORDER BY ID
query.timeout.seconds=30

# Fixed-delay scheduler settings.
scheduler.initial.delay.seconds=2
scheduler.delay.seconds=30
scheduler.shutdown.timeout.seconds=10

# Keep false for an existing Oracle schema. The demo initializer contains H2-oriented DDL.
database.initialize.demo=false
